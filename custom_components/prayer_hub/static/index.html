<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071a18">
  <title>Prayer Hub</title>
  <style>
    :root {
      --gold: #e8c878;
      --cream: #fff8e7;
      --muted: rgba(255,248,231,.72);
      --panel: rgba(5,20,18,.62);
      --glow: rgba(232,200,120,.24);
      --sky-1: #0b312b;
      --sky-2: #071a18;
      --sky-3: #020a09;
      --orb: rgba(232,200,120,.26);
      --accent-2: #8ccfbd;
      --fade: 850ms;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #020a09;
    }

    body {
      color: var(--cream);
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 50% 24%, var(--orb), transparent 28%),
        linear-gradient(160deg, var(--sky-1) 0%, var(--sky-2) 48%, var(--sky-3) 100%);
      transition: background 900ms ease;
    }

    /* Five prayer themes */
    body.theme-fajr {
      --sky-1: #36517a;
      --sky-2: #172c4a;
      --sky-3: #080f21;
      --orb: rgba(255,190,143,.34);
      --gold: #ffd6a3;
      --accent-2: #b9d7ff;
      --panel: rgba(10,22,43,.64);
    }

    body.theme-dhuhr {
      --sky-1: #3d83a5;
      --sky-2: #15546f;
      --sky-3: #092b3c;
      --orb: rgba(255,238,159,.42);
      --gold: #ffe69a;
      --accent-2: #bff4ff;
      --panel: rgba(5,47,62,.62);
    }

    body.theme-asr {
      --sky-1: #7c5c3d;
      --sky-2: #493820;
      --sky-3: #171109;
      --orb: rgba(255,190,96,.38);
      --gold: #ffd08a;
      --accent-2: #f6d6a1;
      --panel: rgba(45,31,15,.65);
    }

    body.theme-maghrib {
      --sky-1: #8f3f4a;
      --sky-2: #4f2340;
      --sky-3: #160b20;
      --orb: rgba(255,149,96,.48);
      --gold: #ffbd87;
      --accent-2: #f5a9c1;
      --panel: rgba(48,17,37,.67);
    }

    body.theme-isha {
      --sky-1: #172d54;
      --sky-2: #0b1732;
      --sky-3: #020611;
      --orb: rgba(111,142,255,.25);
      --gold: #d9c88c;
      --accent-2: #a9bfff;
      --panel: rgba(5,12,31,.69);
    }

    body::before {
      content: "";
      position: fixed;
      inset: -12vmax;
      opacity: .18;
      pointer-events: none;
      background:
        linear-gradient(30deg, transparent 46%, var(--glow) 47%, var(--glow) 49%, transparent 50%) 0 0/84px 48px,
        linear-gradient(150deg, transparent 46%, var(--glow) 47%, var(--glow) 49%, transparent 50%) 0 0/84px 48px;
      animation: drift 30s linear infinite;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 20%, rgba(255,255,255,.08) 0 1px, transparent 2px),
        radial-gradient(circle at 76% 17%, rgba(255,255,255,.08) 0 1px, transparent 2px),
        radial-gradient(circle at center, transparent 30%, rgba(0,0,0,.56) 100%);
      background-size: 180px 180px, 230px 230px, auto;
    }

    @keyframes drift {
      to { transform: translate3d(84px, 48px, 0); }
    }

    #app {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: clamp(14px, 2.8vw, 34px);
      opacity: 0;
      transform: scale(1.018);
      transition: opacity var(--fade) ease, transform var(--fade) ease;
    }

    #app.visible { opacity: 1; transform: scale(1); }
    #app.leaving { opacity: 0; transform: scale(.985); }

    .frame {
      width: min(96vw, 1180px);
      height: min(94vh, 780px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      border: 1px solid rgba(232,200,120,.44);
      border-radius: 28px;
      background: var(--panel);
      backdrop-filter: blur(13px);
      box-shadow: 0 28px 90px rgba(0,0,0,.48);
    }

    header {
      padding: clamp(14px, 3vh, 34px) 20px 6px;
      text-align: center;
    }

    .crescent {
      width: clamp(40px, 6vw, 68px);
      height: clamp(40px, 6vw, 68px);
      margin: 0 auto 8px;
      border-radius: 50%;
      box-shadow: -12px 4px 0 0 var(--gold);
      transform: rotate(-14deg);
      filter: drop-shadow(0 0 18px var(--glow));
    }

    .eyebrow {
      color: var(--muted);
      font: 600 clamp(10px, 1.2vw, 13px)/1.2 system-ui, sans-serif;
      letter-spacing: .34em;
      text-transform: uppercase;
    }

    .names {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: clamp(12px, 2.5vw, 30px);
      margin-top: 7px;
    }

    h1 {
      margin: 0;
      color: var(--gold);
      font-size: clamp(36px, 6.5vw, 78px);
      font-weight: 500;
      line-height: 1;
      text-shadow: 0 4px 26px rgba(0,0,0,.35);
    }

    .arabic-name {
      color: var(--accent-2);
      direction: rtl;
      font-family: "Noto Naskh Arabic", "Amiri", serif;
      font-size: clamp(30px, 5vw, 61px);
    }

    .meta {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 8px;
      color: rgba(255,248,231,.86);
      font: 500 clamp(15px, 2vw, 23px)/1.2 system-ui, sans-serif;
    }

    .dot { color: var(--gold); }

    main {
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 5px clamp(15px, 3.5vw, 46px) 12px;
    }

    .intro, .player-stage {
      grid-area: 1 / 1;
      width: 100%;
      height: 100%;
      transition: opacity 650ms ease, transform 650ms ease;
    }

    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(250px, .75fr);
      gap: clamp(12px, 2.5vw, 28px);
      align-items: stretch;
    }

    .intro.hidden {
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
    }

    .message-panel,
    .content-panel {
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 21px;
      background: rgba(0,0,0,.18);
      box-shadow: inset 0 0 32px rgba(255,255,255,.025);
    }

    .message-panel {
      display: grid;
      place-items: center;
      padding: clamp(16px, 3vw, 34px);
      text-align: center;
    }

    .message {
      margin: 0;
      font-size: clamp(21px, 3vw, 38px);
    }

    .adhan-line {
      margin: 12px 0 2px;
      color: var(--gold);
      direction: rtl;
      font-family: "Noto Naskh Arabic", "Amiri", serif;
      font-size: clamp(31px, 5vw, 58px);
    }

    .countdown {
      width: clamp(72px, 10vw, 112px);
      height: clamp(72px, 10vw, 112px);
      margin: 17px auto 0;
      display: grid;
      place-items: center;
      border: 1px solid rgba(232,200,120,.56);
      border-radius: 50%;
      color: var(--gold);
      font: 500 clamp(34px, 5vw, 59px)/1 system-ui, sans-serif;
      box-shadow: inset 0 0 28px var(--glow);
    }

    .content-panel {
      display: grid;
      align-content: center;
      gap: 14px;
      padding: clamp(15px, 2.5vw, 29px);
      overflow: hidden;
    }

    .content-kicker {
      color: var(--gold);
      font: 700 11px/1.2 system-ui, sans-serif;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .content-arabic {
      color: var(--cream);
      direction: rtl;
      font-family: "Noto Naskh Arabic", "Amiri", serif;
      font-size: clamp(21px, 3vw, 35px);
      line-height: 1.65;
    }

    .content-english {
      color: var(--muted);
      font: 500 clamp(14px, 1.6vw, 19px)/1.45 system-ui, sans-serif;
    }

    .content-reference {
      color: var(--accent-2);
      font: 600 13px/1.2 system-ui, sans-serif;
    }

    .dua-block {
      padding-top: 13px;
      border-top: 1px solid rgba(255,255,255,.1);
    }

    .dua-block .content-arabic {
      font-size: clamp(18px, 2.3vw, 28px);
    }

    .player-stage {
      display: grid;
      place-items: center;
      opacity: 0;
      transform: scale(.97);
      pointer-events: none;
    }

    .player-stage.visible {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    #player-wrap {
      position: relative;
      width: min(100%, 1000px);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 18px;
      background: #000;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    #player, #player iframe {
      width: 100%;
      height: 100%;
      display: block;
    }

    .autoplay-help {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      padding: 30px;
      background: rgba(0,0,0,.8);
      cursor: pointer;
      text-align: center;
      font-family: system-ui, sans-serif;
    }

    .autoplay-help.show { display: grid; }
    .autoplay-help strong {
      display: block;
      margin-bottom: 8px;
      color: var(--gold);
      font-size: 25px;
    }

    footer {
      padding: 8px 18px 18px;
      color: rgba(255,248,231,.58);
      text-align: center;
      font: 12px/1.2 system-ui, sans-serif;
      letter-spacing: .08em;
    }

    .return-button {
      position: fixed;
      z-index: 6;
      top: 11px;
      right: 11px;
      padding: 8px 13px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px;
      background: rgba(0,0,0,.28);
      color: rgba(255,255,255,.78);
      font: 13px system-ui, sans-serif;
    }

    body.playing { background: #000; }
    body.playing::before, body.playing::after { display: none; }
    body.playing #app { padding: 0; }

    body.playing .frame {
      width: 100vw;
      height: 100vh;
      max-width: none;
      max-height: none;
      grid-template-rows: 1fr;
      border: 0;
      border-radius: 0;
      background: #000;
      box-shadow: none;
    }

    body.playing header,
    body.playing footer,
    body.playing .return-button { display: none; }

    body.playing main,
    body.playing .player-stage,
    body.playing #player-wrap,
    body.playing #player,
    body.playing #player iframe {
      width: 100vw !important;
      height: 100vh !important;
      max-width: none;
      padding: 0;
      border-radius: 0;
      box-shadow: none;
      aspect-ratio: auto;
    }

    @media (orientation: landscape) {
      .frame { width: 97vw; height: 95vh; }
      header { padding-top: 11px; }
      .crescent { width: 34px; height: 34px; margin-bottom: 4px; }
    }

    @media (max-width: 760px), (max-height: 480px) {
      .crescent { display: none; }
      .intro { grid-template-columns: 1fr; }
      .content-panel { display: none; }
      header { padding-top: 9px; }
    }
  </style>
</head>
<body>
  <button class="return-button" id="returnButton" type="button">Return to dashboard</button>

  <div id="app">
    <section class="frame" aria-live="polite">
      <header>
        <div class="crescent" aria-hidden="true"></div>
        <div class="eyebrow">Prayer Time</div>
        <div class="names">
          <h1 id="prayerName">Prayer</h1>
          <div class="arabic-name" id="arabicName"></div>
        </div>
        <div class="meta">
          <span id="prayerTime"></span>
          <span class="dot">•</span>
          <span id="islamicDate"></span>
        </div>
      </header>

      <main>
        <section class="intro" id="intro">
          <div class="message-panel">
            <div>
              <p class="message">Prayer has begun</p>
              <div class="adhan-line">حَيَّ عَلَى ٱلصَّلَاةِ</div>
              <div class="countdown" id="countdown">3</div>
            </div>
          </div>

          <aside class="content-panel">
            <div>
              <div class="content-kicker">A reminder from the Qur’an</div>
              <div class="content-arabic" id="verseArabic"></div>
              <div class="content-english" id="verseEnglish"></div>
              <div class="content-reference" id="verseReference"></div>
            </div>

            <div class="dua-block">
              <div class="content-kicker">Duʿā</div>
              <div class="content-arabic" id="duaArabic"></div>
              <div class="content-english" id="duaEnglish"></div>
              <div class="content-reference" id="duaReference"></div>
            </div>
          </aside>
        </section>

        <section class="player-stage" id="playerStage">
          <div id="player-wrap">
            <div id="player"></div>
            <div class="autoplay-help" id="autoplayHelp">
              <div>
                <strong>Tap to play the azaan</strong>
                Browser autoplay was blocked.
              </div>
            </div>
          </div>
        </section>
      </main>

      <footer id="status">Preparing the azaan…</footer>
    </section>
  </div>

  <script>
    (() => {
      "use strict";

      const params = new URLSearchParams(window.location.search);
      const config = {
        prayer: params.get("prayer") || "Prayer",
        prayerTime: params.get("time") || "",
        islamicDate: params.get("islamic_date") || "",
        videoId: params.get("video") || "SI4CScs4D2Q",
        returnUrl: params.get("return") || "/",
        webhookUrl: params.get("webhook") || "",
        countdown: Math.max(0, Number(params.get("countdown") || 3)),
        fallbackSeconds: Math.max(30, Number(params.get("fallback") || 420)),
        volume: Math.min(100, Math.max(0, Number(params.get("volume") || 85)))
      };

      const prayerInfo = {
        fajr: { theme: "fajr", arabic: "الفجر" },
        dhuhr: { theme: "dhuhr", arabic: "الظهر" },
        zuhr: { theme: "dhuhr", arabic: "الظهر" },
        asr: { theme: "asr", arabic: "العصر" },
        maghrib: { theme: "maghrib", arabic: "المغرب" },
        isha: { theme: "isha", arabic: "العشاء" },
        "ishā": { theme: "isha", arabic: "العشاء" },
        prayer: { theme: "isha", arabic: "الصلاة" },
        test: { theme: "isha", arabic: "اختبار" }
      };

      const app = document.getElementById("app");
      const intro = document.getElementById("intro");
      const playerStage = document.getElementById("playerStage");
      const countdownEl = document.getElementById("countdown");
      const statusEl = document.getElementById("status");
      const autoplayHelp = document.getElementById("autoplayHelp");

      let player = null;
      let hasReturned = false;
      let fallbackTimer = null;

      const key = config.prayer.trim().toLowerCase();
      const info = prayerInfo[key] || prayerInfo.prayer;
      document.body.classList.add(`theme-${info.theme}`);

      document.getElementById("prayerName").textContent = config.prayer;
      document.getElementById("arabicName").textContent = info.arabic;
      document.getElementById("prayerTime").textContent = config.prayerTime;
      document.getElementById("islamicDate").textContent = config.islamicDate;
      document.getElementById("returnButton").addEventListener("click", returnToDashboard);

      requestAnimationFrame(() => app.classList.add("visible"));

      function safeReturnUrl(value) {
        try {
          const target = new URL(value, window.location.origin);
          return target.origin === window.location.origin
            ? target.href
            : window.location.origin + "/";
        } catch {
          return window.location.origin + "/";
        }
      }

      function deterministicIndex(length, salt) {
        if (!length) return 0;
        const source = `${new Date().toISOString().slice(0, 10)}:${config.prayer}:${salt}`;
        let hash = 0;
        for (let index = 0; index < source.length; index += 1) {
          hash = ((hash << 5) - hash + source.charCodeAt(index)) | 0;
        }
        return Math.abs(hash) % length;
      }

      function displayItem(prefix, item) {
        document.getElementById(`${prefix}Arabic`).textContent = item?.arabic || "";
        document.getElementById(`${prefix}English`).textContent = item?.english || "";
        document.getElementById(`${prefix}Reference`).textContent = item?.reference || "";
      }

      async function loadCuratedContent() {
        try {
          const response = await fetch("./content.json", { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const content = await response.json();

          const verse = content.verses[
            deterministicIndex(content.verses.length, "verse")
          ];
          const dua = content.duas[
            deterministicIndex(content.duas.length, "dua")
          ];

          displayItem("verse", verse);
          displayItem("dua", dua);
        } catch (error) {
          console.warn("Prayer Hub content could not be loaded:", error);
          displayItem("verse", {
            arabic: "وَأَقِمِ ٱلصَّلَوٰةَ لِذِكْرِى",
            english: "Establish prayer for My remembrance.",
            reference: "Qur’an 20:14"
          });
          displayItem("dua", {
            arabic: "رَبِّ ٱجْعَلْنِى مُقِيمَ ٱلصَّلَوٰةِ",
            english: "My Lord, make me steadfast in prayer.",
            reference: "Qur’an 14:40"
          });
        }
      }

      async function notifyHomeAssistant() {
        if (!config.webhookUrl) return;
        try {
          await fetch(config.webhookUrl, {
            method: "POST",
            mode: "no-cors",
            keepalive: true
          });
        } catch (error) {
          console.warn("Prayer Hub callback failed:", error);
        }
      }

      async function returnToDashboard() {
        if (hasReturned) return;
        hasReturned = true;
        document.body.classList.remove("playing");

        if (fallbackTimer) clearTimeout(fallbackTimer);

        await notifyHomeAssistant();
        app.classList.add("leaving");

        window.setTimeout(() => {
          window.location.replace(safeReturnUrl(config.returnUrl));
        }, 850);
      }

      function revealPlayer() {
        document.body.classList.add("playing");
        intro.classList.add("hidden");
        playerStage.classList.add("visible");
        statusEl.textContent = "Azaan";

        if (player && typeof player.playVideo === "function") {
          player.setVolume(config.volume);
          player.playVideo();
        }
      }

      function beginCountdown() {
        let remaining = config.countdown;
        countdownEl.textContent = remaining;

        if (remaining <= 0) {
          revealPlayer();
          return;
        }

        const timer = window.setInterval(() => {
          remaining -= 1;
          countdownEl.textContent = Math.max(remaining, 0);

          if (remaining <= 0) {
            window.clearInterval(timer);
            revealPlayer();
          }
        }, 1000);
      }

      window.onYouTubeIframeAPIReady = function () {
        player = new YT.Player("player", {
          videoId: config.videoId,
          playerVars: {
            autoplay: 0,
            controls: 1,
            disablekb: 1,
            fs: 0,
            playsinline: 1,
            rel: 0,
            modestbranding: 1,
            origin: window.location.origin
          },
          events: {
            onReady: beginCountdown,
            onStateChange: (event) => {
              if (event.data === YT.PlayerState.ENDED) {
                statusEl.textContent = "Returning to dashboard…";
                returnToDashboard();
              }
            },
            onAutoplayBlocked: () => autoplayHelp.classList.add("show"),
            onError: () => {
              statusEl.textContent = "Unable to play the embedded video.";
              autoplayHelp.classList.add("show");
            }
          }
        });
      };

      autoplayHelp.addEventListener("click", () => {
        autoplayHelp.classList.remove("show");
        if (player) {
          player.setVolume(config.volume);
          player.playVideo();
        }
      });

      loadCuratedContent();

      fallbackTimer = window.setTimeout(
        returnToDashboard,
        config.fallbackSeconds * 1000
      );

      const api = document.createElement("script");
      api.src = "https://www.youtube.com/iframe_api";
      api.async = true;
      document.head.appendChild(api);
    })();
  </script>
</body>
</html>
